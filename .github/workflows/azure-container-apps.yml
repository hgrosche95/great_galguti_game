name: Deploy server to Azure Container Apps

env:
  IMAGE_NAME: ghcr.io/hgrosche95/great-galguti-server
  CONTAINER_APP_NAME: great-galguti-server
  RESOURCE_GROUP: great-galguti-dev-rg

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "src/**"
      - ".github/workflows/azure-container-apps.yml"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag mit der Commit-SHA statt nur :latest, damit Azure Container Apps
      # zuverlaessig eine neue Revision erstellt (bei gleichbleibendem
      # :latest-Tag-String wird das sonst nicht immer erkannt).
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v3
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.IMAGE_NAME }}:${{ github.sha }}
