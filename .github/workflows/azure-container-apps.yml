name: Deploy server to Azure Container Apps

# Nie zwei Deploys gleichzeitig: Azure lehnt parallele Infrastruktur-Deploys
# ab (DeploymentActive). Ein zweiter Lauf wartet, statt abzubrechen; wartet
# schon einer, ersetzt ihn der neueste (der enthält ohnehin alle Commits).
concurrency:
  group: deploy-server-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/hgrosche95/great-galguti-server
  CONTAINER_APP_NAME: great-galguti-server
  RESOURCE_GROUP: great-galguti-dev-rg

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "src/**"
      - ".github/workflows/azure-container-apps.yml"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag mit der Commit-SHA statt nur :latest, damit Azure Container Apps
      # zuverlaessig eine neue Revision erstellt (bei gleichbleibendem
      # :latest-Tag-String wird das sonst nicht immer erkannt).
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v3
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Der Deploy-Schritt meldet Erfolg, sobald Azure das neue Image angenommen hat,
      # nicht erst, wenn die App damit auch startet. job-application-skill#14: Die API
      # startete nicht, der Deploy war trotzdem grün. Deshalb hier warten, bis genau
      # die neue Revision in Azure als gesund läuft UND der Endpunkt antwortet.
      # Nur der Endpunkt allein reicht nicht: Er hat trotz kaputter Revision 200 geliefert.
      - name: Smoke-Test der neuen Revision
        env:
          APP: ${{ env.CONTAINER_APP_NAME }}
          RG: ${{ env.RESOURCE_GROUP }}
          MAX_CODE: "500"
        run: |
          # /auth/me ohne Login antwortet mit 401 - jede Antwort unter 500 heißt: die App läuft.
          URL="https://$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)/auth/me"
          REV=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv)
          echo "Neue Revision: $REV"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$URL" || true)
            STATE=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$REV" \
              --query "join('/', [properties.healthState, properties.runningState])" -o tsv)
            echo "Versuch $i: HTTP $CODE, Revision $STATE"
            case "$STATE" in
              *Failed*) echo "::error::Revision $REV startet nicht ($STATE)"; exit 1 ;;
              */Stopped)
                LATEST=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv)
                if [ "$LATEST" != "$REV" ]; then echo "Revision wurde durch $LATEST abgelöst"; exit 0; fi ;;
              Healthy/Running*)
                if [ "$CODE" -ge 200 ] && [ "$CODE" -lt "$MAX_CODE" ]; then echo "OK"; exit 0; fi ;;
            esac
            sleep 10
          done
          echo "::error::Revision $REV nach 5 Minuten nicht gesund"; exit 1
