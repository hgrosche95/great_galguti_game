name: Deploy web app to Azure Static Web Apps

# Nie zwei Deploys gleichzeitig: Azure lehnt parallele Infrastruktur-Deploys
# ab (DeploymentActive). Ein zweiter Lauf wartet, statt abzubrechen; wartet
# schon einer, ersetzt ihn der neueste (der enthält ohnehin alle Commits).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_LOCATION: "/web"
  OUTPUT_LOCATION: "dist"

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  issues: write
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v7
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # Dependabot-PRs bekommen keine Repo-Secrets, also auch kein Deploy-Token.
          # Dann wird nur gebaut und die Vorschau-Umgebung übersprungen, statt dass
          # jeder Update-PR rot wird.
          skip_deploy_on_missing_secrets: true
          app_location: ${{ env.APP_LOCATION }}
          output_location: ${{ env.OUTPUT_LOCATION }}

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
