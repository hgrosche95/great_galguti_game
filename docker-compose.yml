services:
  postgres:
    image: postgres:16-alpine
    container_name: great-galguti-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: galguti
      POSTGRES_PASSWORD: galguti
      POSTGRES_DB: galguti
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
